name: Syzygy EDL Verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: "Syzygy EDL · Benchmark & Policy Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify Syzygy CLI Engine
        run: |
          python -m edl --version

      - name: Run Policy & Graph Lift Evaluation (6/6 Scenarios)
        env:
          EDL_ALLOW_MEMORY_GRAPH: "1"
        run: |
          python -m edl eval
